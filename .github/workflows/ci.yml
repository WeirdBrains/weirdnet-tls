name: CI
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/weirdnet_release.py validate
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - name: aws-lc-rs only (no ring in the tree)
        run: |
          cargo test --locked --no-default-features --features aws-lc-rs
          ! cargo tree --locked --no-default-features --features aws-lc-rs -e normal -i ring 2>/dev/null | grep -q ring
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - run: cargo package --locked

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: cargo check (aarch64-linux-android, API 26)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --locked --target aarch64-linux-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo check --locked --target aarch64-apple-ios
